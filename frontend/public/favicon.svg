<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Background: dark charcoal square with rounded corners -->
  <rect width="48" height="48" rx="10" fill="#0F0F0F"/>
  <!-- Amber accent bar (top) -->
  <rect x="8" y="7" width="32" height="3" rx="1.5" fill="#D4841A"/>
  <!-- "G" mark: bold amber letter -->
  <text
    x="9"
    y="36"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="22"
    fill="#D4841A"
    letter-spacing="-1"
  >GF</text>
  <!-- Small amber dot — live indicator -->
  <circle cx="40" cy="38" r="4" fill="#22C55E"/>
</svg>
